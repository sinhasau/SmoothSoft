services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon_dev_password
      POSTGRES_DB: salon_platform
    ports:
      - "5432:5432"
    volumes:
      - salon_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  salon_pg_data:

# Render Blueprint for the SmoothSoft API. Connect this repo in Render as a
# "Blueprint" and it reads this file automatically.
#
# The database is NOT defined here on purpose — Render's free-tier Postgres
# expires after 90 days. Use Neon instead (free, no expiry) and paste its
# connection string in when Render prompts for the env var below.
#
# No Redis: REDIS_URL is listed in .env.example as planned future
# infrastructure (multi-instance socket.io/rate-limit scaling — see the
# comments in app.module.ts and queue.gateway.ts) but nothing in the API
# actually connects to Redis yet. Add it back here once that lands.
services:
  - type: web
    name: smoothsoft-api
    runtime: node
    plan: free
    autoDeploy: true
    # --include=dev is required: NODE_ENV=production below applies to this build
    # step too (not just runtime), and npm's documented behavior is to skip
    # devDependencies entirely when NODE_ENV=production is set — but the build
    # itself needs typescript, @types/*, and (for the migrations CI job elsewhere)
    # vitest. NODE_ENV stays production for the actually-running app, which is
    # correct/desired; this just stops it from starving the build step first.
    buildCommand: npm ci --include=dev && npm run build --workspace @salon-platform/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned for reproducibility — verified against this exact version locally.
      - key: NODE_VERSION
        value: 22.20.0
      # The app's runtime role (NOT the migration-owning role — see .env.example).
      - key: DATABASE_URL
        sync: false
      # Deliberately ALSO required at runtime, not just for one-off migration scripts:
      # roster-bootstrap.ts connects with this role specifically to list the dev-login
      # roster across every org before any session/location scope exists, which RLS
      # correctly blocks the normal DATABASE_URL role from doing. Same Neon connection
      # string as DATABASE_URL, but with neondb_owner as the user instead of salon_app.
      - key: DATABASE_MIGRATE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STAFF_PII_ENCRYPTION_KEY
        sync: false
      # Your Vercel deployment's URL, e.g. https://smoothsoft.vercel.app
      - key: CORS_ORIGIN
        sync: false

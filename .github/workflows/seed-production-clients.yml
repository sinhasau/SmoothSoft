# Adds the reference client directory to the already-seeded demo tenant.
# The underlying seed is additive and idempotent by normalized phone number.
name: Seed production demo clients

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ADD DEMO CLIENTS to continue'
        required: true
        type: string

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

jobs:
  seed-clients:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_MIGRATE_URL: ${{ secrets.PRODUCTION_DATABASE_MIGRATE_URL }}
    steps:
      - name: Validate confirmation and secret
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "ADD DEMO CLIENTS" ]; then
            echo "::error::Confirmation did not match; production was not changed."
            exit 1
          fi
          if [ -z "$DATABASE_MIGRATE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_MIGRATE_URL is not set."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require the single reference organization
        run: |
          total=$(psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from organizations")
          matching=$(psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from organizations where name = 'JJ''s Barbers'")
          echo "organizations=$total matching_reference=$matching"
          if [ "$total" -ne 1 ] || [ "$matching" -ne 1 ]; then
            echo "::error::Refusing to seed clients: expected exactly one organization named JJ's Barbers."
            exit 1
          fi

      - name: Record existing reference-client matches
        run: |
          before=$(psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -tAc "
            select count(*) from clients c
            join organizations o on o.id = c.organization_id
            where o.name = 'JJ''s Barbers'
              and c.phone_normalized between '3135550104' and '3135550203'
          ")
          echo "matching_demo_clients_before=$before"

      - name: Seed clients idempotently
        run: npm --prefix apps/api run seed:clients

      - name: Verify client directory
        run: |
          total=$(psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -tAc "
            select count(*) from clients c
            join organizations o on o.id = c.organization_id
            where o.name = 'JJ''s Barbers'
          ")
          echo "clients_after=$total"
          if [ "$total" -lt 30 ]; then
            echo "::error::Expected at least 30 clients after seeding; found $total."
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Production demo clients ready" >> "$GITHUB_STEP_SUMMARY"
          echo "The JJ's Barbers tenant now has 30 idempotently seeded client profiles for search and workflow testing." >> "$GITHUB_STEP_SUMMARY"
